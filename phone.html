<!DOCTYPE html>
<html>
    <head>
        <title>hiiiiiiiiii</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"rel="stylesheet">
        <style>
            body{background-color: chocolate;}
            h1{color: bisque;}
            .card-label {font-size:11px;color:deeppink;text-transform:uppercase;}
            pre {font-size: 11px; color:plum}
        </style>
    </head>
    <body class="py-4">
        <div class="container">
            <h1 class="mb-1">My phone contact</h1>
            <p class="text muted mb-4">Introduction to objects in JavaScript - Grade 4-6 </p>
            <div class="card shadow-sm mb-3" style="max-width:400px;">
                <div class="card-body">
                    <h5 class="card-title"style="color:#ff5a43;">Contact details</h5>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">
                            <span class="card-label d-block">Name</span>
                            <strong id="name">-</strong>
                        </li>
                        <li class="list-group-item">
                            <span class="card-label d-block">Phone</span>
                            <strong id="phone">-</strong>
                        </li>
                        <li class="list-group-item">
                            <span class="card-label d-block">School</span>
                            <strong id="school">-</strong>
                        </li>
                        <li class="list-group-item">
                            <span class="card-label d-block">City</span>
                            <strong id="city">-</strong>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="card shadow-sm" style="max-width: 400px;">
                <div class="card-body">
                    <h6 style="color:cornflowerblue;">JavaScript Object Used</h6>
                    <pre id="codeDisplay" class="bg-light p-3 rounded border mb-0"></pre>
                </div>
            </div>
        </div>
    </body>
</html>
